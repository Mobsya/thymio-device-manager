name: Build, test and package

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tdm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.preset }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            preset: linux-x64
          - os: windows-2022
            preset: windows-x64
          - os: macos-15-intel
            preset: macos-x86_64
          - os: macos-15
            preset: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build tools
        run: python -m pip install 'cmake>=3.25,<4' 'ninja>=1.11,<2'
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl perl pkg-config libavahi-client-dev avahi-daemon
          sudo systemctl start avahi-daemon
      - name: Windows prerequisites and MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install make nasm strawberryperl -y --no-progress
          "C:\Program Files\NASM" >> $env:GITHUB_PATH
          "C:\Strawberry\perl\bin" >> $env:GITHUB_PATH
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $environment = & cmd /s /c "`"$devcmd`" -arch=x64 -host_arch=x64 >nul && set"
          foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV }
          }
      - name: Dependency cache identity
        id: toolchain
        run: |
          python - <<'PY'
          import hashlib, os, platform, subprocess
          values = [os.environ.get('ImageVersion', ''), os.environ.get('VCToolsVersion', ''), platform.machine()]
          for command in [['cmake', '--version'], ['ninja', '--version']]:
              values.append(subprocess.check_output(command, text=True))
          compiler = ['cl'] if os.name == 'nt' else ['c++', '--version']
          values.append(subprocess.run(compiler, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True).stdout)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('identity=' + hashlib.sha256('\n'.join(values).encode()).hexdigest()[:20] + '\n')
          PY
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/downloads
            build/bootstrap
            build/deps
          key: tdm-v1-${{ matrix.preset }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('dependencies.lock.json', 'cmake/bootstrap/**', 'cmake/FetchLocked.cmake', 'scripts/build_dependency.py', 'CMakePresets.json') }}
      - name: Prepare dependencies
        run: make deps PYTHON=python PRESET=${{ matrix.preset }} JOBS=2
      - name: Install and start Bonjour for Windows tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Resolve-Path '.cache/downloads/bonjour_msi-Bonjour64.msi').Path
          $install = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { throw "Bonjour installation failed: $($install.ExitCode)" }
          Start-Service 'Bonjour Service'
      - name: Build and test
        run: make test PYTHON=python PRESET=${{ matrix.preset }} JOBS=2
      - name: Package and inspect runtime dependencies
        run: make package PYTHON=python PRESET=${{ matrix.preset }} JOBS=2
      - name: Package native Mac protocol test tool
        if: runner.os == 'macOS'
        run: tar -czf test-tools-${{ matrix.preset }}.tar.gz -C build/${{ matrix.preset }}/bin protocol-probe
      - name: Create corresponding source bundle for releases
        if: matrix.preset == 'linux-x64' && startsWith(github.ref, 'refs/tags/v')
        run: make source PYTHON=python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.preset }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'macOS'
        with:
          name: test-tools-${{ matrix.preset }}
          path: test-tools-${{ matrix.preset }}.tar.gz
          if-no-files-found: error

  universal:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-macos-*
          path: artifacts
      - name: Combine and sign universal executable
        run: |
          mkdir -p intel arm
          tar -xzf artifacts/package-macos-x86_64/*-macos-x86_64.tar.gz -C intel
          tar -xzf artifacts/package-macos-arm64/*-macos-arm64.tar.gz -C arm
          version=$(cat VERSION.txt)
          python scripts/build.py merge-universal --intel "intel/thymio-device-manager-$version-macos-x86_64" --arm "arm/thymio-device-manager-$version-macos-arm64"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-macos-universal
          path: dist/
          if-no-files-found: error

  verify-universal:
    needs: universal
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            preset: macos-x86_64
          - os: macos-15
            preset: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-macos-universal
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-tools-${{ matrix.preset }}
          path: artifacts
      - name: Test combined executable natively
        run: |
          mkdir extracted tools
          tar -xzf artifacts/*-macos-universal.tar.gz -C extracted
          tar -xzf artifacts/test-tools-${{ matrix.preset }}.tar.gz -C tools
          version=$(cat VERSION.txt)
          package="extracted/thymio-device-manager-$version-macos-universal"
          python scripts/check_artifact.py "$package"
          python tests/smoke.py "$package/bin/thymio-device-manager" tools/protocol-probe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, universal, verify-universal]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: artifacts
      - name: Assemble release and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION.txt)"
          mkdir release
          cp artifacts/package-linux-x64/*.tar.gz release/
          cp artifacts/package-windows-x64/*.zip release/
          cp artifacts/package-macos-universal/*.tar.gz release/
          cd release
          sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --draft --generate-notes --title "Thymio Device Manager $RELEASE_TAG"
